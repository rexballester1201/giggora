# Giggora devnet — 4 QBFT validators + 1 public RPC node.
#
# Security model (brief §30):
#   - Validators hold the signing keys and are NEVER publicly reachable.
#     Their RPC ports bind to 127.0.0.1 for local debugging only.
#   - The RPC node holds no validator key. It is the only node meant to be
#     exposed, and the ADMIN / DEBUG / MINER namespaces are off.
#
# Two things here are load-bearing and must not be "simplified" away:
#
#   1. Static IPs. Besu rejects an enode URL whose host is a DNS name
#      ("Invalid ip address"), so the bootnode needs a fixed address.
#
#   2. --p2p-host=<own static IP> together with --nat-method=NONE.
#      Left to its own devices, Besu's Docker NAT manager advertises
#      enode://...@0.0.0.0:30303, peers cannot dial back, and the bootnode
#      ends up isolated with 0 peers while the chain stalls.
#
# Commands are written out per service rather than shared via a YAML anchor,
# because each node must advertise its own distinct address.
#
# Generated config comes from .env — run scripts/create-genesis.sh first.

name: ${COMPOSE_PROJECT_NAME:-giggora}

x-besu-base: &besu-base
  image: ${BESU_IMAGE}
  restart: unless-stopped
  stop_grace_period: 30s
  # Besu logs ~9 MB/day per node at INFO regardless of load (measured). With no
  # cap, Docker JSON logs grow forever inside docker_data.vhdx, which never
  # shrinks - so uncapped logs are a permanent, one-way claim on the host disk.
  # 20m x 3 keeps ~6 days per node, which is more than enough to debug a devnet,
  # and bounds all five nodes at 300 MB total.
  #
  # deploy/ uses a larger 100m x 5 because a production incident may need more
  # history than a laptop devnet ever will.
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
  # Besu extracts its JNI libraries to java.io.tmpdir on EVERY start and never
  # removes them. Measured: librocksdbjni*.so is 15 MB a copy, and after a day
  # of restarts /tmp held 121 entries and 456 MB PER NODE. It is a per-restart
  # leak, not per-block, so the nodes restarted most during the quorum-loss test
  # were the largest on disk.
  #
  # Chain data is bind-mounted to ./blockchain/nodes (the host disk), but /tmp
  # is the container writable layer — on Docker Desktop that is inside
  # docker_data.vhdx, which grows and never shrinks. So this leak lands on the
  # system drive and stays there.
  #
  # tmpfs keeps it in RAM: it vanishes on stop and never reaches a disk. Besu
  # needs one copy of each library (~50 MB); 256m is ample and tmpfs allocates
  # lazily, so it costs only what is actually written.
  #
  # exec IS LOAD-BEARING. Docker mounts tmpfs noexec,nosuid,nodev by default,
  # and Besu does not merely WRITE those libraries to /tmp, it dlopen()s them.
  # Without exec every node crash-loops on startup with
  #   UnsatisfiedLinkError: libckzg4844jni.so: failed to map segment from
  #   shared object
  # which reads like a corrupt file rather than a mount option. Verified by
  # breaking it exactly this way.
  tmpfs:
    - /tmp:size=256m,exec

services:
  # validator-1 is the bootnode: no --bootnodes flag (self-reference is rejected).
  validator-1:
    <<: *besu-base
    container_name: giggora-validator-1
    hostname: giggora-validator-1
    volumes:
      - ./blockchain/genesis/genesis.json:/config/genesis.json:ro
      - ./blockchain/nodes/validator-1:/data
    networks:
      giggora:
        ipv4_address: ${VALIDATOR_1_IP}
    ports:
      - "127.0.0.1:8551:8545"
    command: >
      --genesis-file=/config/genesis.json
      --data-path=/data
      --node-private-key-file=/data/key
      --nat-method=NONE
      --p2p-host=${VALIDATOR_1_IP}
      --p2p-port=${P2P_PORT}
      --min-gas-price=${MIN_GAS_PRICE}
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT
      --host-allowlist=*
      --rpc-http-cors-origins=all
      --profile=ENTERPRISE
      --logging=INFO

  validator-2:
    <<: *besu-base
    container_name: giggora-validator-2
    hostname: giggora-validator-2
    volumes:
      - ./blockchain/genesis/genesis.json:/config/genesis.json:ro
      - ./blockchain/nodes/validator-2:/data
    networks:
      giggora:
        ipv4_address: ${VALIDATOR_2_IP}
    ports:
      - "127.0.0.1:8552:8545"
    command: >
      --genesis-file=/config/genesis.json
      --data-path=/data
      --node-private-key-file=/data/key
      --nat-method=NONE
      --p2p-host=${VALIDATOR_2_IP}
      --p2p-port=${P2P_PORT}
      --bootnodes=${BOOTNODE_ENODE}
      --min-gas-price=${MIN_GAS_PRICE}
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT
      --host-allowlist=*
      --rpc-http-cors-origins=all
      --profile=ENTERPRISE
      --logging=INFO

  validator-3:
    <<: *besu-base
    container_name: giggora-validator-3
    hostname: giggora-validator-3
    volumes:
      - ./blockchain/genesis/genesis.json:/config/genesis.json:ro
      - ./blockchain/nodes/validator-3:/data
    networks:
      giggora:
        ipv4_address: ${VALIDATOR_3_IP}
    ports:
      - "127.0.0.1:8553:8545"
    command: >
      --genesis-file=/config/genesis.json
      --data-path=/data
      --node-private-key-file=/data/key
      --nat-method=NONE
      --p2p-host=${VALIDATOR_3_IP}
      --p2p-port=${P2P_PORT}
      --bootnodes=${BOOTNODE_ENODE}
      --min-gas-price=${MIN_GAS_PRICE}
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT
      --host-allowlist=*
      --rpc-http-cors-origins=all
      --profile=ENTERPRISE
      --logging=INFO

  validator-4:
    <<: *besu-base
    container_name: giggora-validator-4
    hostname: giggora-validator-4
    volumes:
      - ./blockchain/genesis/genesis.json:/config/genesis.json:ro
      - ./blockchain/nodes/validator-4:/data
    networks:
      giggora:
        ipv4_address: ${VALIDATOR_4_IP}
    ports:
      - "127.0.0.1:8554:8545"
    command: >
      --genesis-file=/config/genesis.json
      --data-path=/data
      --node-private-key-file=/data/key
      --nat-method=NONE
      --p2p-host=${VALIDATOR_4_IP}
      --p2p-port=${P2P_PORT}
      --bootnodes=${BOOTNODE_ENODE}
      --min-gas-price=${MIN_GAS_PRICE}
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT
      --host-allowlist=*
      --rpc-http-cors-origins=all
      --profile=ENTERPRISE
      --logging=INFO

  # Public-facing node. No validator key -> structurally cannot propose blocks.
  # Serves JSON-RPC + WebSocket to MetaMask, DApps, and the indexer.
  rpc:
    <<: *besu-base
    container_name: giggora-rpc
    hostname: giggora-rpc
    depends_on: [validator-1]
    volumes:
      - ./blockchain/genesis/genesis.json:/config/genesis.json:ro
      - ./blockchain/nodes/rpc:/data
    networks:
      giggora:
        ipv4_address: ${RPC_IP}
    # Loopback only. Without the 127.0.0.1 prefix Docker publishes on 0.0.0.0,
    # so the devnet's JSON-RPC — with TXPOOL and QBFT namespaces enabled and
    # host-allowlist wide open — was reachable from every machine on the LAN.
    # MetaMask on this host uses localhost and is unaffected. To share the
    # devnet deliberately, change the prefix here rather than removing it.
    ports:
      - "127.0.0.1:${RPC_HTTP_PORT}:8545"
      - "127.0.0.1:${RPC_WS_PORT}:8546"
    command: >
      --genesis-file=/config/genesis.json
      --data-path=/data
      --nat-method=NONE
      --p2p-host=${RPC_IP}
      --p2p-port=${P2P_PORT}
      --bootnodes=${BOOTNODE_ENODE}
      --min-gas-price=${MIN_GAS_PRICE}
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT,TRACE,TXPOOL
      --rpc-ws-enabled
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --rpc-ws-api=ETH,NET,WEB3
      --host-allowlist=*
      --rpc-http-cors-origins=all
      --profile=ENTERPRISE
      --logging=INFO

  # --- Phase 4: indexer datastore ---
  # Bound to 127.0.0.1 only: the database is never publicly exposed (brief §32).
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: giggora-postgres
    hostname: giggora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Blockscout opens a large connection pool of its own; the default 100 is
    # not enough once our indexer and psql sessions are added.
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - giggora-pgdata:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
    networks:
      giggora:
        ipv4_address: ${POSTGRES_IP}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ===========================================================================
  # EXPLORER STACK — opt-in, behind the "explorer" profile.
  #
  #   docker compose up -d                        chain only (default, fast)
  #   docker compose --profile explorer up -d     chain + indexer + API + UI
  #
  # Profiled rather than default on purpose. These two images cost ~800 MB to
  # build, and on Docker Desktop that lands in docker_data.vhdx, which never
  # shrinks. Someone who only wants a chain to point MetaMask at should not pay
  # for an explorer they did not ask for.
  #
  # The images come from deploy/explorer/, so the devnet and a real deployment
  # build the SAME artifacts — a devnet that passes with a different image than
  # production ships is not evidence of much.
  #
  # These publish the same host ports the manual "node indexer/src/index.ts"
  # workflow uses, so run one or the other, never both.
  # ===========================================================================

  # Migrations, as a one-shot, so `npm run stack` is genuinely one command.
  # Every migration is idempotent (see scripts/db-migrate.sh), so running this
  # on every start is safe and means the indexer can never come up against a
  # schema older than its code.
  migrate:
    profiles: ["explorer"]
    image: ${POSTGRES_IMAGE}
    container_name: giggora-migrate
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: giggora-postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/migrations:/migrations:ro
    networks: [giggora]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'set -e; for f in /migrations/*.sql; do
         echo "applying $$f";
         psql -v ON_ERROR_STOP=1 -q -f "$$f";
       done; echo "migrations ok"'
    logging: &explorer-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  indexer:
    profiles: ["explorer"]
    build:
      context: .
      dockerfile: deploy/explorer/Dockerfile.node
    image: giggora/explorer-node:latest
    container_name: giggora-indexer
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rpc:      { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    environment:
      # Container-internal addresses. The host .env points at localhost, which
      # is this container, not the database.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@giggora-postgres:5432/${POSTGRES_DB}
      RPC_URL: http://giggora-rpc:8545
      CHAIN_ID: ${CHAIN_ID}
      CHAIN_NAME: ${CHAIN_NAME}
      CURRENCY_NAME: ${CURRENCY_NAME}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL}
      CURRENCY_DECIMALS: ${CURRENCY_DECIMALS}
    command: ["node", "indexer/src/index.ts"]
    networks: [giggora]
    logging: &explorer-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    profiles: ["explorer"]
    image: giggora/explorer-node:latest
    container_name: giggora-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      indexer:  { condition: service_started }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@giggora-postgres:5432/${POSTGRES_DB}
      # The API talks to the chain too, not only the database: live balances and
      # code are read straight from the node, because a cached balance is a
      # wrong balance. Omit this and it dies at import time with
      #   No URL was provided to the Transport.
      RPC_URL: http://giggora-rpc:8545
      API_HOST: 0.0.0.0
      API_PORT: "4100"
      CHAIN_ID: ${CHAIN_ID}
      CHAIN_NAME: ${CHAIN_NAME}
      CURRENCY_NAME: ${CURRENCY_NAME}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL}
      CURRENCY_DECIMALS: ${CURRENCY_DECIMALS}
    command: ["node", "explorer-api/src/server.ts"]
    # Published because the BROWSER calls this directly, not only the web
    # container — NEXT_PUBLIC_API_BASE has to be an address the browser resolves.
    ports:
      - "127.0.0.1:4100:4100"
    networks: [giggora]
    logging: *explorer-logging

  web:
    profiles: ["explorer"]
    build:
      context: .
      dockerfile: deploy/explorer/Dockerfile.web
      args:
        # BUILD-TIME. Next inlines NEXT_PUBLIC_* into the client bundle, so
        # these must be what the BROWSER can reach, and changing one needs a
        # rebuild, not a restart.
        NEXT_PUBLIC_API_BASE: http://localhost:4100
        NEXT_PUBLIC_RPC_URL: ${RPC_URL}
        NEXT_PUBLIC_EXPLORER_URL: http://localhost:3000
        NEXT_PUBLIC_NETWORK_LABEL: ${CHAIN_NAME} ${CHAIN_NETWORK}
        NEXT_PUBLIC_FAUCET_URL: http://localhost:4200
    image: giggora/explorer-web:latest
    container_name: giggora-web
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    environment:
      # Server components stay on the docker network; only the browser goes via
      # localhost.
      API_BASE: http://giggora-api:4100
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    networks: [giggora]
    logging: *explorer-logging

  # --------------------------------------------------------------------------
  # Faucet. Same image as the indexer and API, different command.
  #
  # On the devnet it signs with the PUBLISHED Anvil #1 key and refuses to start
  # unless the NODE reports chain 4043 — see faucet/src/config.ts. To run it
  # anywhere else, set FAUCET_PRIVATE_KEY and it will use that instead.
  # --------------------------------------------------------------------------
  faucet:
    profiles: ["explorer"]
    image: giggora/explorer-node:latest
    container_name: giggora-faucet
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rpc:      { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@giggora-postgres:5432/${POSTGRES_DB}
      RPC_URL: http://giggora-rpc:8545
      CHAIN_ID: ${CHAIN_ID}
      CHAIN_NAME: ${CHAIN_NAME}
      CURRENCY_NAME: ${CURRENCY_NAME}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL}
      CURRENCY_DECIMALS: ${CURRENCY_DECIMALS}
      # 0.0.0.0 INSIDE the container; the published port below is loopback-only
      # on the host, so this is not a public bind.
      FAUCET_HOST: 0.0.0.0
      FAUCET_PORT: "4200"
      # Where the portal's "View the transaction" links point — a BROWSER
      # address, so localhost rather than the container name.
      FAUCET_EXPLORER_URL: http://localhost:3000
      FAUCET_PRIVATE_KEY: ${FAUCET_PRIVATE_KEY:-}
      FAUCET_IP_SALT: ${FAUCET_IP_SALT:-giggora-faucet-devnet-salt}
    command: ["node", "faucet/src/server.ts"]
    ports:
      - "127.0.0.1:4200:4200"
    networks: [giggora]
    logging: *explorer-logging


volumes:
  giggora-pgdata:
    name: giggora-pgdata

networks:
  giggora:
    name: giggora
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
